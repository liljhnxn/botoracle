<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  
  <!-- Outer glowing telemetry ring -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="#00F2FE" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="3 3" />
  
  <!-- Concentric inner orbit -->
  <circle cx="32" cy="32" r="14" fill="none" stroke="url(#cyanGrad)" stroke-width="2" filter="url(#glow)" />
  
  <!-- Central Oracle Beacon -->
  <circle cx="32" cy="32" r="6" fill="url(#cyanGrad)" filter="url(#glow)" />
  <circle cx="32" cy="32" r="2.5" fill="#ffffff" />
  
  <!-- 4 Telemetry Nodes -->
  <circle cx="32" cy="11" r="2.5" fill="#10B981" />
  <circle cx="32" cy="53" r="2.5" fill="#10B981" />
  <circle cx="11" cy="32" r="2.5" fill="#00F2FE" />
  <circle cx="53" cy="32" r="2.5" fill="#00F2FE" />

  <!-- Connecting Crosshair Ray Lines -->
  <line x1="32" y1="14" x2="32" y2="25" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.7" stroke-linecap="round" />
  <line x1="32" y1="39" x2="32" y2="50" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.7" stroke-linecap="round" />
  <line x1="14" y1="32" x2="25" y2="32" stroke="#00F2FE" stroke-width="1.5" stroke-opacity="0.7" stroke-linecap="round" />
  <line x1="39" y1="32" x2="50" y2="32" stroke="#00F2FE" stroke-width="1.5" stroke-opacity="0.7" stroke-linecap="round" />
</svg>
